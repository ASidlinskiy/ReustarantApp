<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">        
        <link rel="shortcut icon" href="img/favicon_32x32.ico" type="image/x-icon">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main>
            <header>
                <div class="wrapper">
                    <div class="hero">
                        <h1>Al's Diner: where the taste is prime<span class="hero-subtext">Sit, savor, and feel sublime.</span></h1>       
                    </div>
                </div>
            </header>
            <div class="wrapper">
                <div class="menu">
                    
                </div>
                <div class="menu-item-selected">
                </div>   
                <template id="menuItemTemplate">
                    <div class="menu-item">
                        <p class="menu-item-emoji">${emoji}</p>
                        <div class="menu-item-description">
                            <h2 class="menu-item-description-heading">${name}</h2>
                            <p class="menu-item-description-ingredients">${ingredients}</p>
                            <p class="menu-item-description-price">$${price}</p>
                        </div>
                        <div class="menu-item-buttons">
                            <button class="menu-item-button-add" data-menu-id="${id}" aria-label="Add ${name} to cart">add</button>
                        </div>
                    </div>
                    <form class="menu-item-form">
                        <h2>Your order</h2>
                        <div>
                            <ul class="menu-item-form-cart">
                                <li class="row">
                                    <div>
                                        <p class="menu-item-form-cart-emoji"></p>
                                        <p class="menu-item-form-cart-name"></p>
                                        <button data-menu-id="${selectedItem.id}" class="menu-item-form-cart-btn">Remove</button>
                                        <p class="menu-item-form-cart-price"></p>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        <p class="menu-item-selected-order-totall">Total price</p>                        
                        <button type="submit">Complete order</button>
                    </form>                    
                </template>                             
            </div>
        </main>
	<script src="index.js" type="module"></script>
    </body>
</html>
